name: Build APT Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build APT repo
        uses: morph027/apt-repo-action@v3
        id: create-apt-repo
        with:
          repo-name: mxd-linux
          signing-key: ${{ secrets.SIGNING_KEY }}
          scan-dir: repo/
          architectures: amd64
          codename: stable

      - name: Add index.html
        run: |
          cat > ${{ steps.create-apt-repo.outputs.dir }}/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><title>MXD-Linux APT Repository</title></head>
          <body>
          <h1>MXD-Linux APT Repository</h1>
          <pre>deb https://yosh781.github.io/MXD-Linux stable main</pre>
          </body></html>
          EOF
      - name: Copy public.key into repo
        run: |
          cp public.key ${{ steps.create-apt-repo.outputs.dir }}/public.key
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.create-apt-repo.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
